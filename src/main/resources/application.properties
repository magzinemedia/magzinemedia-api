spring.application.name=contact-api

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:contactdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}

app.jwt.secret=${APP_JWT_SECRET:local-dev-only-insecure-secret-please-change-me-1234567890}
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}

app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.notify-to=${APP_MAIL_NOTIFY_TO:}
app.mail.from-address=${APP_MAIL_FROM_ADDRESS:}
app.mail.from-name=${APP_MAIL_FROM_NAME:Magzine Media}
app.brevo.api-key=${BREVO_API_KEY:}

app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key=${R2_ACCESS_KEY_ID:}
app.r2.secret-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket=${R2_BUCKET_NAME:}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
